name: vkd3d Rust translation probe

on:
  workflow_dispatch:
  push:
    branches: [w3-shader-full-compiler-probe, w3-c2rust-win64-abi, w3-shader-variable-offset-fix, w3-shader-offset-harness-fix, w4-shader-format-report-graph]
    paths:
      - .github/workflows/vkd3d-rust-probe.yml
      - tools/vkd3d-rust-probe/*.py
      - tools/vkd3d-rust-probe/*.rs
      - tools/vkd3d-rust-probe/patches/**
      - tools/vkd3d-rust-probe/abi-fixtures/**
      - tools/vkd3d-rust-probe/offset-fixtures/**
      - tools/vkd3d-rust-probe/variadic-fixtures/**
      - tools/vkd3d-rust-probe/fixtures/cursor-witness/**
      - tools/vkd3d/build.sh

permissions:
  contents: read

concurrency:
  group: vkd3d-rust-probe-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  C2RUST_REV: ac687698b6c13491dfec45c6a9ad9e8b4da35227
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-18
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ubuntu LLVM 18 and source preparation dependencies
        id: packages
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/vkd3d-probe/logs"
          exec > >(tee "$RUNNER_TEMP/vkd3d-probe/logs/packages.log") 2>&1
          echo "MDS_VKD3D_OUT=$RUNNER_TEMP/vkd3d-probe/prepared" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/c2rust-target" >> "$GITHUB_ENV"
          cat /etc/apt/sources.list.d/ubuntu.sources
          cat /etc/apt/apt-mirrors.txt
          grep -Fx 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          # Bypass the hosted Azure mirror without changing the signed Ubuntu sources.
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          apt-cache policy clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev cmake libssl-dev pkg-config bison flex libjson-perl xz-utils
          dpkg-query -W clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev
          clang-18 --version
          llvm-config-18 --version
          uname -a
          free -b
      - name: Install pinned Rust compiler
        id: rust
        timeout-minutes: 3
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version
      - name: Run Python helper tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools/vkd3d-rust-probe -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/vkd3d-probe/logs/python-helper-tests.log"
      - name: Prepare pinned patched vkd3d source and generated headers
        id: source
        timeout-minutes: 8
        run: |
          bash tools/vkd3d/build.sh linux-native > "$RUNNER_TEMP/vkd3d-probe/logs/source.log" 2>&1
          source_dir="$MDS_VKD3D_OUT/work-linux-native/vkd3d-2.1"
          test -f "$source_dir/include/config.h"
          for unit in hlsl.c hlsl.tab.c hlsl.yy.c d3d_asm.c; do
            test -s "$source_dir/libs/vkd3d-shader/$unit"
          done
          sha256sum tools/vkd3d/build.sh tools/vkd3d/patches/*.patch > "$RUNNER_TEMP/vkd3d-probe/logs/preparation-sha256.txt"
      - name: Build the pinned official C2Rust tool once
        id: tool
        timeout-minutes: 12
        run: |
          exec > >(tee "$RUNNER_TEMP/vkd3d-probe/logs/c2rust.log") 2>&1
          git init "$RUNNER_TEMP/c2rust-src"
          git -C "$RUNNER_TEMP/c2rust-src" remote add origin https://github.com/immunant/c2rust.git
          git -C "$RUNNER_TEMP/c2rust-src" fetch --depth 1 origin "$C2RUST_REV"
          git -C "$RUNNER_TEMP/c2rust-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/c2rust-src" rev-parse HEAD)" = "$C2RUST_REV"
          python3 tools/vkd3d-rust-probe/apply_c2rust_patch.py \
            --source "$RUNNER_TEMP/c2rust-src" --artifacts "$RUNNER_TEMP/vkd3d-probe/logs"
          cargo +1.95.0 install --locked --path "$RUNNER_TEMP/c2rust-src/c2rust" --root "$RUNNER_TEMP/vkd3d-probe/tool"
          python3 tools/vkd3d-rust-probe/apply_c2rust_patch.py \
            --source "$RUNNER_TEMP/c2rust-src" --artifacts "$RUNNER_TEMP/vkd3d-probe/logs" \
            --tool "$RUNNER_TEMP/vkd3d-probe/tool"
          python3 - <<'PY_CAPTURE'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/vkd3d-rust-probe')
          from probe import run
          from full_compiler import collect_cursor_witness
          logs = Path(os.environ['RUNNER_TEMP']) / 'vkd3d-probe/logs'
          tool = Path(os.environ['RUNNER_TEMP']) / 'vkd3d-probe/tool/bin/c2rust-transpile'
          def capture(root, source, directory, flags):
              database = root / 'compile_commands.json'
              database.write_text(json.dumps([{'directory': str(directory), 'file': str(source),
                  'arguments': ['/usr/bin/clang-18', *flags, '-c', str(source)]}]))
              proof = collect_cursor_witness(tool, database, root / 'paired', run,
                  {'unit': str(source), 'static': 'vkd3d_spirv_build_op_member_name'})
              witnesses = sorted((root / 'paired/raw').rglob('*.cursor-witness.json'))
              if len(witnesses) != 1:
                  raise SystemExit('Native capture did not retain exactly one raw witness')
              witness = witnesses[0]
              raw = json.loads(witness.read_text())
              prefix = witness.name.removesuffix('.cursor-witness.json')
              if raw.get('schema') != 2 or raw.get('unit') != str(source) or not raw.get('native_inputs'):
                  raise SystemExit('Native capture did not produce schema-2 input facts')
              for suffix in ('.cursor.cbor', '.typed-ast.txt', '.variadic.json'):
                  if not witness.with_name(prefix + suffix).is_file():
                      raise SystemExit('Native capture missing paired raw artifact ' + suffix)
              (root / 'capture.json').write_text(json.dumps({'status': 'raw_facts_captured',
                  'authorization': 'witness_only', 'proof_status': proof['status']}, indent=2) + '\n')
          root = (logs / 'cursor-native-facts').resolve()
          root.mkdir(parents=True)
          source = root / 'pilot.c'
          shutil.copy2('tools/vkd3d-rust-probe/fixtures/cursor-witness/pilot.c', source)
          capture(root, source, root, ['-std=c11'])
          prepared = (Path(os.environ['MDS_VKD3D_OUT']) / 'work-linux-native/vkd3d-2.1').resolve()
          root = (logs / 'cursor-production-facts').resolve()
          root.mkdir(parents=True)
          flags = ['-DHAVE_CONFIG_H', '-D_WIN32_WINNT=0x0600', '-std=c99']
          flags += ['-I' + str(prepared / p) for p in ('.', 'include', 'include/private', 'libs/vkd3d-shader')]
          flags += ['-I' + str(prepared.parent / p / 'include') for p in ('hdr', 'spv')]
          flags += ['-DLIBVKD3D_SHADER_SOURCE', '-DVKD3D_DEBUG_ENV=VKD3D_SHADER_DEBUG']
          capture(root, (prepared / 'libs/vkd3d-shader/spirv.c').resolve(), prepared, flags)
          PY_CAPTURE
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" \
            -p c2rust-transpile --tests --no-run
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" \
            -p c2rust-transpile --lib win64_foreign_block_names_and_reexports
          python3 tools/vkd3d-rust-probe/check_enum_constants.py \
            --source "$RUNNER_TEMP/c2rust-src" \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --clang /usr/bin/clang-18 \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/logs/enum-constants"
          python3 tools/vkd3d-rust-probe/check_stable_boundaries.py \
            --source "$RUNNER_TEMP/c2rust-src" \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --clang /usr/bin/clang-18 \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/logs/stable-boundaries"
          python3 tools/vkd3d-rust-probe/check_function_pointer_nulls.py \
            --source "$RUNNER_TEMP/c2rust-src" \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --clang /usr/bin/clang-18 \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/logs/function-pointer-nulls"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" \
            -p c2rust-transpile --lib closed_variadic_inventory_uses_promoted_ast_types_and_linker_identity
          python3 tools/vkd3d-rust-probe/check_closed_variadic_inventory.py \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --clang /usr/bin/clang-18 \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/logs/closed-variadic-inventory"
          cp "$RUNNER_TEMP/c2rust-src/Cargo.lock" "$RUNNER_TEMP/vkd3d-probe/logs/c2rust-Cargo.lock"
          cp "$RUNNER_TEMP/c2rust-src/LICENSE" "$RUNNER_TEMP/vkd3d-probe/tool/LICENSE"
          "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" --version
          python3 tools/vkd3d-rust-probe/check_runtime.py \
            --tool "$RUNNER_TEMP/vkd3d-probe/tool" --record
          sha256sum "$RUNNER_TEMP/vkd3d-probe/tool/bin/"* > "$RUNNER_TEMP/vkd3d-probe/logs/c2rust-binaries-sha256.txt"
      - name: Bundle prepared input and tool executables
        id: bundle
        timeout-minutes: 2
        run: |
          tar --exclude='*.o' --exclude='*.lo' --exclude='.libs' --exclude='.deps' \
            -czf "$RUNNER_TEMP/vkd3d-probe/prepared.tar.gz" \
            -C "$RUNNER_TEMP/vkd3d-probe" prepared/work-linux-native prepared/linux-native tool
          sha256sum "$RUNNER_TEMP/vkd3d-probe/prepared.tar.gz" > "$RUNNER_TEMP/vkd3d-probe/logs/bundle-sha256.txt"
      - name: Record setup status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PACKAGES_STATUS: ${{ steps.packages.outcome }}
          RUST_STATUS: ${{ steps.rust.outcome }}
          SOURCE_STATUS: ${{ steps.source.outcome }}
          TOOL_STATUS: ${{ steps.tool.outcome }}
          BUNDLE_STATUS: ${{ steps.bundle.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'vkd3d-probe/logs'
          root.mkdir(parents=True, exist_ok=True)
          result = {key: os.environ.get(key, 'unavailable') for key in ('JOB_STATUS', 'PACKAGES_STATUS', 'RUST_STATUS', 'SOURCE_STATUS', 'TOOL_STATUS', 'BUNDLE_STATUS', 'C2RUST_REV', 'GITHUB_SHA', 'ImageVersion')}
          result['status'] = 'success' if result['JOB_STATUS'] == 'success' else 'setup_failure'
          (root / 'setup.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Probe setup\n\n' + result['status'] + '\n')
          PY
      - name: Preserve setup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vkd3d-probe-setup
          path: ${{ runner.temp }}/vkd3d-probe/logs/
          retention-days: 7
          if-no-files-found: error
      - name: Share prepared input and tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vkd3d-probe-input
          path: ${{ runner.temp }}/vkd3d-probe/prepared.tar.gz
          retention-days: 1
          if-no-files-found: error

  translate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and record the existing host
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/vkd3d-probe/evidence"
          exec > >(tee "$RUNNER_TEMP/vkd3d-probe/evidence/unit-setup.log") 2>&1
          rustup toolchain install 1.95.0 --profile minimal
          clang-18 --version
          uname -a
          free -b
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vkd3d-probe-input
          path: ${{ runner.temp }}/vkd3d-probe
      - name: Extract prepared source and tool
        run: tar -xzf "$RUNNER_TEMP/vkd3d-probe/prepared.tar.gz" -C "$RUNNER_TEMP/vkd3d-probe"
      - name: Require the matching prepared LLVM runtime
        timeout-minutes: 1
        run: |
          python3 tools/vkd3d-rust-probe/check_runtime.py \
            --tool "$RUNNER_TEMP/vkd3d-probe/tool" \
            2>&1 | tee "$RUNNER_TEMP/vkd3d-probe/evidence/runtime-check.log"
      - name: Prove C and translated Rust Win64 ABI in both directions
        timeout-minutes: 4
        run: |
          python3 tools/vkd3d-rust-probe/abi_smoke.py \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/evidence/abi-smoke"
      - name: Compare variable offsetof against Clang using actual shader layouts
        timeout-minutes: 4
        run: |
          python3 tools/vkd3d-rust-probe/check_variable_offsetof.py \
            --source "$RUNNER_TEMP/vkd3d-probe/prepared/work-linux-native/vkd3d-2.1" \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/evidence/variable-offsetof"
      - name: Translate the real blob failure point before the all-unit probe
        timeout-minutes: 4
        run: |
          python3 tools/vkd3d-rust-probe/probe.py \
            --source "$RUNNER_TEMP/vkd3d-probe/prepared/work-linux-native/vkd3d-2.1" \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/evidence/blob" \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --clang /usr/bin/clang-18 --rust-toolchain 1.95.0 \
            --filter '/vkd3d-common/blob\.c$' --timeout 60 --translation-only
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'vkd3d-probe/evidence/blob'
          result = json.loads((root / 'result.json').read_text())
          assert result['transpile']['exit_code'] == 0, result
          assert result['complete_translation'], result
          assert result['translation_units'] == 1, result
          entry = json.loads((root / 'compile_commands.json').read_text())[0]
          command = entry['arguments'][:-2] + ['-Xclang', '-ast-dump-all', '-fsyntax-only', entry['file']]
          with (root / 'clang18-blob-ast.log').open('w') as output:
              subprocess.run(command, cwd=entry['directory'], stdout=output, stderr=subprocess.STDOUT, check=True, timeout=60)
          assert result.get('invalid_output_markers', []) == [], result
          PY
      - name: Translate all 24 units, build, link, and compare
        timeout-minutes: 55
        run: |
          exec > >(tee "$RUNNER_TEMP/vkd3d-probe/evidence/probe.log") 2>&1
          python3 tools/vkd3d-rust-probe/probe.py \
            --source "$RUNNER_TEMP/vkd3d-probe/prepared/work-linux-native/vkd3d-2.1" \
            --artifacts "$RUNNER_TEMP/vkd3d-probe/evidence/result" \
            --c2rust "$RUNNER_TEMP/vkd3d-probe/tool/bin/c2rust" \
            --clang /usr/bin/clang-18 --rust-toolchain 1.95.0 \
            --all-unit-prototype --timeout 1800 --build-timeout 300 \
            --native-library "$RUNNER_TEMP/vkd3d-probe/prepared/linux-native/lib/libvkd3d-shader.so.1"
      - name: Inventory actual closed variadic symbols across all 24 units
        if: always()
        timeout-minutes: 2
        run: |
          python3 tools/vkd3d-rust-probe/closed_variadic_plan.py \
            --probe "$RUNNER_TEMP/vkd3d-probe/evidence/result" \
            --output "$RUNNER_TEMP/vkd3d-probe/evidence/closed-variadic-plan.json"
      - name: Collect separately paired cursor witness across all 24 units
        if: always()
        timeout-minutes: 35
        run: |
          python3 - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/vkd3d-rust-probe')
          from full_compiler import collect_cursor_witness
          from probe import run
          import os
          root = Path(os.environ['RUNNER_TEMP']) / 'vkd3d-probe'
          source = root / 'evidence/result/source/libs/vkd3d-shader/spirv.c'
          proof = collect_cursor_witness(root / 'tool/bin/c2rust-transpile',
              root / 'evidence/result/compile_commands.json', root / 'evidence/cursor-witness', run,
              {'unit': str(source), 'static': 'vkd3d_spirv_build_op_member_name'})
          if proof['status'] != 'witness_proven':
              raise SystemExit('Actual pilot witness rejected: ' + proof['reason'])
          PYCODE
      - name: Validate and summarize actual output
        if: always()
        run: |
          python3 tools/vkd3d-rust-probe/validate.py \
            "$RUNNER_TEMP/vkd3d-probe/evidence/result/result.json" \
            --all-units >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all generated source, logs, hashes, and extern inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vkd3d-probe-all-units
          path: |
            ${{ runner.temp }}/vkd3d-probe/evidence/
            !${{ runner.temp }}/vkd3d-probe/evidence/result/rust-target/
            !${{ runner.temp }}/vkd3d-probe/evidence/result/raw-target/
            !${{ runner.temp }}/vkd3d-probe/evidence/result/working-target/
          retention-days: 7
          if-no-files-found: warn
