name: Windows build

on:
  workflow_call:
    inputs:
      release-tag:
        description: Existing tag to validate and package; empty for CI
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test scheduled-task exit boundary (stand-in scheduler)
        run: python -I tools/windows/test_runtask.py
      - name: Test DirectX response diagnostics and execution guards
        run: ./tools/ci/test-directx-runtime.ps1
      - name: Validate tag and version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release.py --tag "$env:RELEASE_TAG"
      - name: Select fresh job-owned Conan cache
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'dbvt-conan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}'
          "CONAN_HOME=$cache" >> $env:GITHUB_ENV
      - name: Install Conan
        run: python -m pip install conan==2.27.1
      - name: Test CMake DBVT evidence controls
        run: |
          python -I tools/bullet-dbvt-cmake-reference/test_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -O tools/bullet-dbvt-cmake-reference/test_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/bullet-rust-dbvt-check/test_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -O tools/bullet-rust-dbvt-check/test_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test UTF-8 GitHub event identity
        run: |
          python -I tools/bullet-dbvt-cmake-reference/test_check.py Controls.test_identity_captures_checkout_and_pr_not_only_event_sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -O tools/bullet-dbvt-cmake-reference/test_check.py Controls.test_identity_captures_checkout_and_pr_not_only_event_sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build vendored Bullet and configure dependencies
        run: python -I tools/bullet-dbvt-cmake-reference/check.py prepare --out-dir out/ci/dbvt-reference
      - name: Configure Release
        run: >-
          cmake -S . -B out/ci/build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/out/ci/build/generators/conan_toolchain.cmake"
          -DBUILD_TESTING=ON -DMIKUDANCESTUDIO_DIAG=OFF
          -DCMAKE_EXE_LINKER_FLAGS=/VERBOSE:LIB
      - name: Build Release
        run: >-
          python -I tools/bullet-dbvt-cmake-reference/check.py record-build --out-dir out/ci/dbvt-reference
          --build-command cmake --build out/ci/build --config Release --parallel 4
          -- /verbosity:normal /clp:ShowCommandLine
      - name: Install legacy DirectX test runtime
        run: |
          . ./tools/ci/install-directx-runtime.ps1
          Install-DirectXRuntime -OutputDirectory (Join-Path $env:RUNNER_TEMP 'directx-diagnostic')
      - name: Preserve DirectX response diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: directx-diagnostic-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/directx-diagnostic/response.json
            ${{ runner.temp }}/directx-diagnostic/directx_Jun2010_redist.exe
          if-no-files-found: error
      - name: Set up pinned Rust for Windows checks
        if: always()
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup run 1.95.0 rustc -Vv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare Rust camera refresh with the production C++ body
        working-directory: rust
        env:
          MDS_CAMERA_RELOAD_ORACLE: ${{ github.workspace }}/out/ci/build/Release/camera_reload_oracle.exe
          MDS_CAMERA_RELOAD_LOG_DIR: ${{ github.workspace }}/out/ci/build/camera-reload-comparisons
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --locked -p mds-doc --test camera_reload 2>&1 |
            Tee-Object -FilePath ../out/ci/build/camera-reload-comparison.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Release regressions
        run: >-
          ctest --test-dir out/ci/build -C Release --output-on-failure
          --timeout 90 --no-tests=error
          --output-junit "$env:GITHUB_WORKSPACE/out/ci/build/test-results.xml"
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.arch }}
          path: |
            out/ci/build/test-results.xml
            out/ci/build/Testing/Temporary/*.log
          if-no-files-found: warn
      - name: Verify native camera evidence
        if: always()
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE 'out/ci/build'
          $manifest = Get-Content (Join-Path $build 'camera_reload_manifest.json') -Raw -ErrorAction Stop | ConvertFrom-Json
          foreach ($entry in $manifest.PSObject.Properties) {
            $hash = (Get-FileHash (Join-Path $build $entry.Name) -Algorithm SHA256 -ErrorAction Stop).Hash
            if ($hash -ne $entry.Value) { throw "Camera evidence hash mismatch: $($entry.Name)" }
          }
          Get-Item (Join-Path $build 'camera-reload-comparison.log') -ErrorAction Stop | Out-Null
          $cases = @(Get-ChildItem (Join-Path $build 'camera-reload-comparisons') -Filter '*.output.txt' -ErrorAction Stop)
          if ($cases.Count -eq 0) { throw 'No native camera comparisons retained' }
      - name: Preserve native camera provenance and comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-reload-${{ matrix.arch }}
          path: |
            out/ci/build/camera_reload_source.cpp
            out/ci/build/camera_reload_body.inc
            out/ci/build/camera_reload_manifest.json
            out/ci/build/camera-reload-comparison.log
            out/ci/build/camera-reload-comparisons/
          if-no-files-found: error
      - name: Package
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release.py --tag "$env:RELEASE_TAG" --build-dir out/ci/build --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-tag != ''
        with:
          name: release-${{ matrix.arch }}
          path: out/release/*
          if-no-files-found: error

      - name: Measure actual CMake DBVT archive and compare pure Rust
        if: always()
        run: python -I tools/bullet-dbvt-cmake-reference/check.py measure --out-dir out/ci/dbvt-reference
      - name: Preserve CMake DBVT reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbvt-cmake-reference-${{ matrix.arch }}
          path: |
            out/ci/dbvt-reference/
            !out/ci/dbvt-reference/rust-driver/target/
          if-no-files-found: error
