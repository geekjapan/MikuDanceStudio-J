name: Bullet DBVT actual consumer profile

on:
  push:
    branches: [w3-bullet-dbvt-consumer-profile]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bullet-dbvt-consumer-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Actual consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and run helper checks
        shell: bash
        run: |
          CONSUMER_OUT="$RUNNER_TEMP/bullet-dbvt-consumer-profile"
          echo "CONSUMER_OUT=$CONSUMER_OUT" >> "$GITHUB_ENV"
          mkdir -p "$CONSUMER_OUT"
          set -o pipefail
          rustup toolchain install 1.95.0 --profile minimal 2>&1 | tee "$CONSUMER_OUT/toolchain-install.log"
          python3 -m unittest discover -s tools/bullet-dbvt-consumer-profile -v 2>&1 | tee "$CONSUMER_OUT/helper-tests.log"
      - name: Measure final configured consumer and compare Rust
        if: runner.os != 'Windows'
        shell: bash
        env:
          CXX: clang++
        run: |
          set -o pipefail
          python3 tools/bullet-dbvt-consumer-profile/check.py --out-dir "$CONSUMER_OUT" --target '${{ matrix.target }}' 2>&1 | tee "$CONSUMER_OUT/check.log"
      - name: Activate native x64 MSVC and measure actual consumer
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 > "%CONSUMER_OUT%\vsdevcmd.log" 2>&1
          if errorlevel 1 exit /b 1
          set CXX=cl
          python tools\bullet-dbvt-consumer-profile\check.py --out-dir "%CONSUMER_OUT%" --target ${{ matrix.target }} > "%CONSUMER_OUT%\check.log" 2>&1
          set CHECK_RESULT=%ERRORLEVEL%
          type "%CONSUMER_OUT%\check.log"
          exit /b %CHECK_RESULT%
      - name: Save observations even when compatibility fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-dbvt-consumer-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/bullet-dbvt-consumer-profile/*.*
          if-no-files-found: error
