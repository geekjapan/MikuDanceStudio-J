name: Exact CMP translation input diagnostic

on:
  push:
    branches: [w4-shader-cmp-input]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vkd3d-cmp-input-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  finite-input-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the existing LLVM 18 and pinned Rust runtime
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/cmp-input/logs"
          exec > >(tee "$RUNNER_TEMP/cmp-input/logs/runtime-setup.log") 2>&1
          cat /etc/apt/sources.list.d/ubuntu.sources
          cat /etc/apt/apt-mirrors.txt
          grep -Fx 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 -vV
          clang-18 --version
          llvm-config-18 --version
          uname -a
          free -b
          git rev-parse HEAD HEAD^{tree}
      - name: Acquire the unchanged two helper-purpose pins
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 -B tools/vkd3d-rust-probe/member_name_lowering.py \
            --acquire-helper-inputs "$RUNNER_TEMP/cmp-input/helper-inputs" \
            2>&1 | tee "$RUNNER_TEMP/cmp-input/logs/helper-acquisition.log"
      - name: Acquire the separately authorized current immutable native input
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 -B tools/vkd3d-rust-probe/run_cmp_input.py \
            --acquire "$RUNNER_TEMP/cmp-input/current-input" \
            2>&1 | tee "$RUNNER_TEMP/cmp-input/logs/current-input-acquisition.log"
      - name: Focused inert boundary checks in normal and optimized Python
        timeout-minutes: 2
        env:
          CMP_INPUT_TEST_TMP: ${{ runner.temp }}/cmp-input
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s tools/vkd3d-rust-probe -p test_cmp_input.py -v \
            2>&1 | tee "$RUNNER_TEMP/cmp-input/logs/focused-normal.log"
          python3 -B -O -m unittest discover -s tools/vkd3d-rust-probe -p test_cmp_input.py -v \
            2>&1 | tee "$RUNNER_TEMP/cmp-input/logs/focused-optimized.log"
      - name: Verify the exact prepared compiler and runtime
        timeout-minutes: 2
        run: |
          set -o pipefail
          python3 -B tools/vkd3d-rust-probe/check_runtime.py \
            --tool "$RUNNER_TEMP/cmp-input/current-input/unpacked/tool" \
            2>&1 | tee "$RUNNER_TEMP/cmp-input/logs/tool-runtime.log"
      - name: Normalize actual C, translate all24 twice, build and compare both input orders
        timeout-minutes: 85
        run: |
          set -o pipefail
          python3 -B tools/vkd3d-rust-probe/run_cmp_input.py \
            --source "$RUNNER_TEMP/cmp-input/current-input/unpacked/prepared/work-linux-native/vkd3d-2.1" \
            --native-library "$RUNNER_TEMP/cmp-input/current-input/unpacked/prepared/linux-native/lib/libvkd3d-shader.so.1.19.0" \
            --c2rust "$RUNNER_TEMP/cmp-input/current-input/unpacked/tool/bin/c2rust" \
            --clang /usr/bin/clang-18 --target x86_64-unknown-linux-gnu \
            --artifacts "$RUNNER_TEMP/cmp-input/actual" \
            2>&1 | tee "$RUNNER_TEMP/cmp-input/logs/actual-boundary.log"
      - name: Preserve partial evidence and the separate stable acceptance state
        if: always()
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'cmp-input'
          report = root / 'actual/report.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              if report.is_file():
                  data = json.loads(report.read_text())
                  output.write('CMP boundary: ' + data['status'] + '\n\nStable acceptance: '
                               + data['stable_acceptance'] + '\n\nFour targets/product integration: UNRUN\n')
              else:
                  output.write('CMP boundary: FAILED before an actual probe report; inspect partial logs.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vkd3d-cmp-input-boundary
          path: |
            ${{ runner.temp }}/cmp-input/
            !${{ runner.temp }}/cmp-input/actual/correct/raw-target/
            !${{ runner.temp }}/cmp-input/actual/correct/working-target/
            !${{ runner.temp }}/cmp-input/actual/correct/rust-target/
            !${{ runner.temp }}/cmp-input/actual/opposite/raw-target/
            !${{ runner.temp }}/cmp-input/actual/opposite/working-target/
            !${{ runner.temp }}/cmp-input/actual/opposite/rust-target/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
