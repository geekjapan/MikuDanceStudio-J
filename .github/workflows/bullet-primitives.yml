name: Bullet primitives and dynamics

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bullet-primitives-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'branch' }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pure:
    name: Native-free Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Record host and toolchain provenance
        run: |
          mkdir -p "$RUNNER_TEMP/bullet-pure"
          { git rev-parse HEAD; uname -a; rustup run 1.95.0 rustc -Vv; python3 --version; } 2>&1 | tee "$RUNNER_TEMP/bullet-pure/provenance.log"
          git ls-files --stage recipes/bullet275/bullet-src/src rust/crates/mds-bullet rust/crates/mds-bullet-sys/shim rust/crates/mds-crtmath 'tools/bullet-rust-*' > "$RUNNER_TEMP/bullet-pure/source-manifest.txt"
      - name: Check all frozen fixtures without native code
        run: |
          set -o pipefail
          python3 tools/bullet-rust-math-check/check.py --rust-only --out-dir "$RUNNER_TEMP/bullet-pure" 2>&1 | tee "$RUNNER_TEMP/bullet-pure/check.log"
      - name: Save native-free evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-pure-${{ matrix.os }}
          path: ${{ runner.temp }}/bullet-pure
          if-no-files-found: warn

  native:
    name: Native recapture (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Record native provenance
        run: |
          mkdir -p "$RUNNER_TEMP/bullet-native"
          { git rev-parse HEAD; uname -a; clang++ --version; rustup run 1.95.0 rustc -Vv; python3 --version; } 2>&1 | tee "$RUNNER_TEMP/bullet-native/provenance.log"
          git ls-files --stage recipes/bullet275/bullet-src/src rust/crates/mds-bullet rust/crates/mds-bullet-sys/shim rust/crates/mds-crtmath 'tools/bullet-rust-*' > "$RUNNER_TEMP/bullet-native/source-manifest.txt"
      - name: Recapture math and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/math"
          python3 tools/bullet-rust-math-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/math" 2>&1 | tee "$RUNNER_TEMP/bullet-native/math/check.log"
      - name: Recapture shapes and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/shapes"
          python3 tools/bullet-rust-shape-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/shapes" 2>&1 | tee "$RUNNER_TEMP/bullet-native/shapes/check.log"
      - name: Recapture joint-rows and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/joint-rows"
          python3 tools/bullet-rust-joint-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/joint-rows" 2>&1 | tee "$RUNNER_TEMP/bullet-native/joint-rows/check.log"
      - name: Recapture contacts and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/contacts"
          python3 tools/bullet-rust-contact-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/contacts" 2>&1 | tee "$RUNNER_TEMP/bullet-native/contacts/check.log"
      - name: Recapture joint coordinates and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/coordinates"
          python3 tools/bullet-rust-coordinate-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/coordinates" 2>&1 | tee "$RUNNER_TEMP/bullet-native/coordinates/check.log"
      - name: Recapture body kernels and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/bodies"
          python3 tools/bullet-rust-body-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/bodies" 2>&1 | tee "$RUNNER_TEMP/bullet-native/bodies/check.log"
      - name: Recapture pair cache and compare every frozen operation
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/pair-cache"
          python3 tools/bullet-rust-pair-cache-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/pair-cache" 2>&1 | tee "$RUNNER_TEMP/bullet-native/pair-cache/check.log"
      - name: Recapture 32-bit axis sweep and compare every frozen operation
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/axis-sweep"
          python3 tools/bullet-rust-axis-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/axis-sweep" 2>&1 | tee "$RUNNER_TEMP/bullet-native/axis-sweep/check.log"
      - name: Recapture joint solver and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/solver"
          python3 tools/bullet-rust-solver-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/solver" 2>&1 | tee "$RUNNER_TEMP/bullet-native/solver/check.log"
      - name: Recapture contact solver and compare every frozen bit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/contact-solver"
          python3 tools/bullet-rust-contact-solver-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/contact-solver" 2>&1 | tee "$RUNNER_TEMP/bullet-native/contact-solver/check.log"
      - name: Recapture box-box candidates and production manifolds
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/box-box"
          python3 tools/bullet-rust-box-box-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/box-box" 2>&1 | tee "$RUNNER_TEMP/bullet-native/box-box/check.log"
      - name: Recapture Voronoi simplex operations and defined state
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bullet-native/simplex"
          python3 tools/bullet-rust-simplex-check/check.py --out-dir "$RUNNER_TEMP/bullet-native/simplex" 2>&1 | tee "$RUNNER_TEMP/bullet-native/simplex/check.log"
      - name: Save native recaptures and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-native-linux-x64
          path: ${{ runner.temp }}/bullet-native
          if-no-files-found: warn
