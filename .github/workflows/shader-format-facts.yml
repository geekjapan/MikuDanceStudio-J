name: Shader compiler format facts

on:
  push:
    branches: [w4-shader-format-report-graph]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shader-format-facts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  C2RUST_REV: ac687698b6c13491dfec45c6a9ad9e8b4da35227
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-18
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned translator dependencies
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/logs"
          exec > >(tee "$RUNNER_TEMP/format-facts/logs/packages.log") 2>&1
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev cmake libssl-dev pkg-config bison flex libjson-perl xz-utils
          dpkg-query -W clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev
          echo "MDS_VKD3D_OUT=$RUNNER_TEMP/format-facts/prepared" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/c2rust-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.95.0 --profile minimal
      - name: Test compiler-free transport normally and optimized
        timeout-minutes: 4
        run: |
          python3 -B -m unittest discover -s tools/vkd3d-rust-probe -p test_closed_format_facts.py
          python3 -B -O -m unittest discover -s tools/vkd3d-rust-probe -p test_closed_format_facts.py
      - name: Prepare pinned native source and headers
        timeout-minutes: 8
        run: |
          bash tools/vkd3d/build.sh linux-native > "$RUNNER_TEMP/format-facts/logs/source.log" 2>&1
          test -f "$MDS_VKD3D_OUT/work-linux-native/vkd3d-2.1/include/config.h"
          sha256sum tools/vkd3d/build.sh tools/vkd3d/patches/*.patch > "$RUNNER_TEMP/format-facts/logs/source-tools.sha256"
      - name: Build and test the actual patched compiler
        timeout-minutes: 18
        run: |
          exec > >(tee "$RUNNER_TEMP/format-facts/logs/compiler.log") 2>&1
          git init "$RUNNER_TEMP/c2rust-src"
          git -C "$RUNNER_TEMP/c2rust-src" remote add origin https://github.com/immunant/c2rust.git
          git -C "$RUNNER_TEMP/c2rust-src" fetch --depth 1 origin "$C2RUST_REV"
          git -C "$RUNNER_TEMP/c2rust-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/c2rust-src" rev-parse HEAD)" = "$C2RUST_REV"
          python3 -B tools/vkd3d-rust-probe/apply_c2rust_patch.py --source "$RUNNER_TEMP/c2rust-src" --artifacts "$RUNNER_TEMP/format-facts/logs"
          cargo +1.95.0 install --locked --path "$RUNNER_TEMP/c2rust-src/c2rust" --root "$RUNNER_TEMP/format-facts/tool"
          python3 -B tools/vkd3d-rust-probe/apply_c2rust_patch.py --source "$RUNNER_TEMP/c2rust-src" --artifacts "$RUNNER_TEMP/format-facts/logs" --tool "$RUNNER_TEMP/format-facts/tool"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_format_ -- --list | tee "$RUNNER_TEMP/format-facts/logs/closed-format-tests-list.log"
          grep -F 'closed_format_native_record_identity_is_compiler_owned: test' "$RUNNER_TEMP/format-facts/logs/closed-format-tests-list.log"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_format_ -- --nocapture | tee "$RUNNER_TEMP/format-facts/logs/closed-format-tests-execution.log"
          grep -E 'test .*closed_format_native_record_identity_is_compiler_owned \.\.\. ok' "$RUNNER_TEMP/format-facts/logs/closed-format-tests-execution.log"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_variadic_inventory_uses_promoted_ast_types_and_linker_identity
          python3 -B tools/vkd3d-rust-probe/check_runtime.py --tool "$RUNNER_TEMP/format-facts/tool" --record
          cp "$RUNNER_TEMP/c2rust-src/Cargo.lock" "$RUNNER_TEMP/format-facts/logs/Cargo.lock"
          rustc +1.95.0 --version
          clang-18 --version
      - name: Bundle source and compiler for extraction
        run: |
          tar --exclude='*.o' --exclude='*.lo' --exclude='.libs' --exclude='.deps' -czf "$RUNNER_TEMP/format-facts/input.tar.gz" -C "$RUNNER_TEMP/format-facts" prepared/work-linux-native tool
          sha256sum "$RUNNER_TEMP/format-facts/input.tar.gz" > "$RUNNER_TEMP/format-facts/logs/input.sha256"
      - name: Retain setup and partial failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-format-facts-setup
          path: ${{ runner.temp }}/format-facts/logs/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-format-facts-input
          path: ${{ runner.temp }}/format-facts/input.tar.gz
          retention-days: 1
          if-no-files-found: error

  extract:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shader-format-facts-input
          path: ${{ runner.temp }}/format-facts
      - name: Install the matching translator runtime
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/evidence"
          exec > >(tee "$RUNNER_TEMP/format-facts/evidence/runtime-setup.log") 2>&1
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang-18 llvm-18-dev libclang-cpp18 libllvm18
          rustup toolchain install 1.95.0 --profile minimal
      - name: Extract prepared source and actual compiler
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/evidence"
          tar -xzf "$RUNNER_TEMP/format-facts/input.tar.gz" -C "$RUNNER_TEMP/format-facts"
          python3 -B tools/vkd3d-rust-probe/check_runtime.py --tool "$RUNNER_TEMP/format-facts/tool"
      - name: Exercise compiler extraction fixtures
        timeout-minutes: 6
        run: |
          python3 -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/vkd3d-rust-probe')
          from full_compiler import collect_closed_format_fixture
          from probe import run
          root = Path(os.environ['RUNNER_TEMP']) / 'format-facts'
          collect_closed_format_fixture(root / 'tool/bin/c2rust-transpile', Path('/usr/bin/clang-18'), root / 'evidence/compiler-fixture', run)
          PY
      - name: Check all24 native units and collect exact paired report-only outputs
        timeout-minutes: 65
        run: |
          python3 -B tools/vkd3d-rust-probe/probe.py --closed-format-facts \
            --source "$RUNNER_TEMP/format-facts/prepared/work-linux-native/vkd3d-2.1" \
            --artifacts "$RUNNER_TEMP/format-facts/evidence/result" \
            --c2rust "$RUNNER_TEMP/format-facts/tool/bin/c2rust" --clang /usr/bin/clang-18 --timeout 1800
          python3 -B tools/vkd3d-rust-probe/closed_format_facts.py --replay "$RUNNER_TEMP/format-facts/evidence/result/closed-format-facts"
          python3 -B -O tools/vkd3d-rust-probe/closed_format_facts.py --replay "$RUNNER_TEMP/format-facts/evidence/result/closed-format-facts"
      - name: Retain complete packet or raw partial extraction failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-format-facts-all24
          path: ${{ runner.temp }}/format-facts/evidence/
          retention-days: 7
          if-no-files-found: error
