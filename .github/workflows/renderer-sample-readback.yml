name: Renderer mapped sample readback diagnostic

on:
  push:
    branches: [w4-renderer-sample-readback-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-sample-readback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sample-readback:
    name: Sample readback and independent f32 replay (Linux x64 llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install existing build and Vulkan dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang pkg-config libvulkan1 mesa-vulkan-drivers vulkan-tools
          rustup toolchain install 1.95.0 --profile minimal
      - name: Exercise compiler-free evidence rejection
        run: |
          python3 tools/renderer-sample-readback/test_run.py
          python3 -O tools/renderer-sample-readback/test_run.py
      - name: Run sequential canonical suites and independent replay under existing GPU lock
        run: >-
          flock "${TMPDIR:-/tmp}/mds-rust-test.lock"
          python3 tools/renderer-sample-readback/run.py --run
          --out "${{ runner.temp }}/renderer-sample-evidence"
          --build-root "${{ runner.temp }}/renderer-sample-build"
      - name: Recheck sealed evidence without executing binaries
        run: |
          python3 tools/renderer-sample-readback/run.py --out "${{ runner.temp }}/renderer-sample-evidence"
          python3 -O tools/renderer-sample-readback/run.py --out "${{ runner.temp }}/renderer-sample-evidence"
      - name: Preserve evidence and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renderer-sample-readback-${{ github.sha }}
          path: ${{ runner.temp }}/renderer-sample-evidence
          include-hidden-files: true
          if-no-files-found: error
