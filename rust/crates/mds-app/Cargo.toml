[package]
name = "mds-app"
description = "The MikuDanceStudio application: the editor window on mds-doc, mds-physics and mds-render, and the headless frame dump"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mds-accessory = { path = "../mds-accessory" }
mds-doc = { path = "../mds-doc" }
mds-formats = { path = "../mds-formats" }
# The Kinect / OpenNI capture of the MoCap menu.
mds-kinect = { path = "../mds-kinect" }
mds-math = { path = "../mds-math" }
# MME: the plans, the runtime on wgpu, and the vkd3d-shader compiler it loads.
mds-mme = { path = "../mds-mme" }
mds-mmert = { path = "../mds-mmert" }
mds-shader = { path = "../mds-shader" }
# The WAV the timeline plays and the AVI writer of the recording.
mds-media = { path = "../mds-media" }
# The types mds-doc commands carry (`Command::ScaleFrames` takes `mds_ops::RangeScale`).
mds-ops = { path = "../mds-ops" }
mds-physics = { path = "../mds-physics" }
mds-pose = { path = "../mds-pose" }
mds-render = { path = "../mds-render" }
mds-scene = { path = "../mds-scene" }
# The window: eframe on wgpu without its default backends (no GL, no WebGPU), so Cargo.lock keeps
# the one wgpu 30.0.1 and feature set of mds-render.
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11", "wayland"] }
egui = "=0.37.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }
# File dialogs and the unsaved-changes prompts.
rfd = "=0.17.2"
# The WAV's sound (`audio`): the system output on Windows (WASAPI), macOS (Core Audio) and Linux (ALSA).
cpal = { version = "0.18.2", optional = true }

[features]
default = ["audio"]
audio = ["dep:cpal"]
# Loads Data\DxOpenNI.dll for the Kinect capture (Windows only).
dxopenni = ["mds-kinect/dxopenni"]

[dev-dependencies]
png = "0.18"
