name: Portable formats

on:
  push:
    branches: [next, 'validation/rhi-resources-*']
  pull_request:

permissions:
  contents: read

jobs:
  cpu-simulation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU simulation tests
        run: cmake -S cmake/cpu-simulation-tests -B build-cpu-simulation -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-cpu-simulation --config Release --parallel 2
      - name: Test CPU simulation
        run: ctest --test-dir build-cpu-simulation -C Release --output-on-failure
  formats:
    if: ${{ !startsWith(github.ref_name, 'validation/rhi-resources-') }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-portable -DMIKUDANCESTUDIO_FORMATS_ONLY=ON -DBUILD_TESTING=ON -DMIKUDANCESTUDIO_RHI_D3D9=${{ runner.os == 'Windows' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build-portable --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-portable -C Release --output-on-failure
  resources:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure resource lifecycle tests
        run: cmake -S cmake/rhi-resource-tests -B build-resources -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-resources --config Release --parallel 2
      - name: Test resource lifecycle
        run: ctest --test-dir build-resources -C Release --output-on-failure
