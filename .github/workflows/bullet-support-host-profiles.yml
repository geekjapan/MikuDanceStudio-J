name: Bullet support native host profiles

on:
  push:
    branches: [w3-bullet-support-host-profiles]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bullet-support-host-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Support native and Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare evidence and the pinned toolchain
        shell: bash
        run: |
          PROFILE_OUT="$RUNNER_TEMP/bullet-support-host"
          echo "PROFILE_OUT=$PROFILE_OUT" >> "$GITHUB_ENV"
          mkdir -p "$PROFILE_OUT"
          set -o pipefail
          rustup toolchain install 1.95.0 --profile minimal 2>&1 | tee "$PROFILE_OUT/toolchain-install.log"
          git rev-parse HEAD > "$PROFILE_OUT/source-head.txt"
          git ls-files --stage recipes/bullet275/bullet-src/src rust/crates/mds-bullet rust/crates/mds-bullet-sys/shim rust/crates/mds-crtmath tools/bullet-rust-support-check > "$PROFILE_OUT/source-manifest.txt"
          python3 -m unittest discover -s tools/bullet-rust-support-check -v 2>&1 | tee "$PROFILE_OUT/helper-tests.log"
      - name: Capture native and replay full Rust output
        if: runner.os != 'Windows'
        shell: bash
        env:
          CXX: clang++
        run: |
          set -o pipefail
          python3 tools/bullet-rust-support-check/check.py --out-dir "$PROFILE_OUT/capture" 2>&1 | tee "$PROFILE_OUT/check.log"
      - name: Activate MSVC and capture native and full Rust output
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 > "%PROFILE_OUT%\vsdevcmd.log" 2>&1
          if errorlevel 1 exit /b 1
          where cl > "%PROFILE_OUT%\compiler-path.txt" 2>&1
          if errorlevel 1 exit /b 1
          set CXX=cl
          python tools\bullet-rust-support-check\check.py --out-dir "%PROFILE_OUT%\capture" > "%PROFILE_OUT%\check.log" 2>&1
          set CHECK_RESULT=%ERRORLEVEL%
          type "%PROFILE_OUT%\check.log"
          exit /b %CHECK_RESULT%
      - name: Save complete captures and provenance even for unknown profiles
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-support-host-${{ matrix.os }}
          path: ${{ runner.temp }}/bullet-support-host
          if-no-files-found: error
