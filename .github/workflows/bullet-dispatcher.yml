name: Bullet persistent dispatcher

on:
  push:
    branches: [w3-bullet-persistent-dispatcher]
  pull_request:
    paths:
      - 'rust/crates/mds-bullet/src/core/**'
      - 'rust/crates/mds-bullet/tests/**'
      - 'rust/crates/mds-crtmath/**'
      - 'rust/crates/mds-bullet-sys/shim/**'
      - 'recipes/bullet275/bullet-src/src/**'
      - 'tools/bullet-rust-dispatcher-check/**'
      - '.github/workflows/bullet-dispatcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-host:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: X64
          - os: macos-15
            arch: ARM64
          - os: ubuntu-24.04
            arch: X64
          - os: ubuntu-24.04-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Assert supported runner architecture
        shell: bash
        run: test '${{ runner.arch }}' = '${{ matrix.arch }}'
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Compare native and Rust dispatcher traces
        if: runner.os != 'Windows'
        shell: bash
        env:
          CXX: clang++
        run: python3 tools/bullet-rust-dispatcher-check/check.py --out-dir "$RUNNER_TEMP/bullet-dispatcher"
      - name: Compare MSVC native and Rust dispatcher traces
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          set CXX=cl
          python tools\bullet-rust-dispatcher-check\check.py --out-dir "%RUNNER_TEMP%\bullet-dispatcher"
      - name: Retain complete evidence on every result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bullet-dispatcher-${{ matrix.os }}
          path: ${{ runner.temp }}/bullet-dispatcher
          if-no-files-found: error
