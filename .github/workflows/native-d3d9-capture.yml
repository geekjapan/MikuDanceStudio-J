name: Native D3D9 capability and unchanged capture

on:
  pull_request:
    paths:
      - '.github/workflows/native-d3d9-capture.yml'
      - '.github/workflows/windows-build.yml'
      - 'CMakeLists.txt'
      - 'tools/oracle/d3d9_capability.cpp'
      - 'tools/oracle/d3d9_capture.py'
      - 'tools/oracle/test_d3d9_capture.py'
      - 'tools/windows/provision_capture_vc90.ps1'
      - 'tools/windows/test_provision_capture_vc90.py'
      - 'tools/windows/fixtures/vc90-*/**'
      - 'tools/windows/provision_capture_audio.ps1'
      - 'tools/windows/test_provision_capture_audio.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    uses: ./.github/workflows/windows-build.yml
    with:
      d3d9-capture: true
