name: Bullet mixed solveGroup parity

on:
  push:
    branches: [w3-bullet-mixed-solver]
  pull_request:
    paths:
      - 'rust/crates/mds-bullet/src/core/**'
      - 'rust/crates/mds-crtmath/**'
      - 'tools/bullet-rust-mixed-solver-check/**'
      - 'recipes/bullet275/bullet-src/src/**'
      - '.github/workflows/bullet-mixed-solver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-host:
    name: Native and Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Validate trace parser and native observation hooks
        shell: bash
        run: python3 -m unittest discover -s tools/bullet-rust-mixed-solver-check -v
      - name: Compare actual native solveGroup, complete traces and behavioral mutations
        if: runner.os != 'Windows'
        shell: bash
        env:
          CXX: clang++
        run: python3 tools/bullet-rust-mixed-solver-check/check.py --out-dir "$RUNNER_TEMP/bullet-mixed" --mutations
      - name: Compare MSVC native solveGroup, complete traces and behavioral mutations
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          set CXX=cl
          python tools\bullet-rust-mixed-solver-check\check.py --out-dir "%RUNNER_TEMP%\bullet-mixed" --mutations
      - name: Retain native inputs, observer diff, complete traces and mutation differences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-mixed-${{ matrix.os }}
          path: ${{ runner.temp }}/bullet-mixed
          if-no-files-found: error
