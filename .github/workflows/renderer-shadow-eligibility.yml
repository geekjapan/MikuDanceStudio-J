name: Conditional native shadow call eligibility

on:
  push:
    branches: [w4-renderer-shadow-eligibility-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-shadow-eligibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Actual canonical shadow capture (Linux x64 llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install existing build and Vulkan dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang pkg-config libvulkan1 mesa-vulkan-drivers vulkan-tools
          rustup toolchain install 1.95.0 --profile minimal
      - name: Exercise compiler-free rejection controls
        run: |
          python3 -B tools/renderer-shadow-eligibility/test_run.py
          python3 -B -O tools/renderer-shadow-eligibility/test_run.py
      - name: Capture two sequential canonical suites under existing GPU lock
        run: >-
          flock "${TMPDIR:-/tmp}/mds-rust-test.lock"
          python3 -B tools/renderer-shadow-eligibility/run.py --run capture
          --out "${{ runner.temp }}/shadow-evidence"
          --build-root "${{ runner.temp }}/shadow-build"
      - name: Verify without executing binaries and create mode-preserving transport
        run: |
          python3 -B tools/renderer-shadow-eligibility/run.py --out "${{ runner.temp }}/shadow-evidence"
          python3 -B -O tools/renderer-shadow-eligibility/run.py --out "${{ runner.temp }}/shadow-evidence" --bundle "${{ runner.temp }}/shadow-capture.tar"
      - name: Retain incomplete Linux execution receipts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shadow-capture-incomplete-${{ github.sha }}
          path: ${{ runner.temp }}/shadow-evidence
          if-no-files-found: warn
          include-hidden-files: true
      - name: Retain Linux capture
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shadow-capture-${{ github.sha }}
          path: ${{ runner.temp }}/shadow-capture.tar
          if-no-files-found: error
          include-hidden-files: true
  native:
    name: SDK native predicate execution (Windows x64)
    needs: capture
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Preserve fixed source bytes during checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shadow-capture-${{ github.sha }}
          path: ${{ runner.temp }}/shadow-download
      - name: Execute SDK-only predicates, directed boundaries and normal-exit semantic mutant
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$install) { throw 'MSVC discovery failed' }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          cmd /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment failed' }
          python -B tools/renderer-shadow-eligibility/run.py --run native --archive "${{ runner.temp }}/shadow-download/shadow-capture.tar" --out "${{ runner.temp }}/shadow-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read-only native evidence replay and mode-preserving bundle
        shell: pwsh
        run: |
          python -B tools/renderer-shadow-eligibility/run.py --archive "${{ runner.temp }}/shadow-download/shadow-capture.tar" --out "${{ runner.temp }}/shadow-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -O tools/renderer-shadow-eligibility/run.py --archive "${{ runner.temp }}/shadow-download/shadow-capture.tar" --out "${{ runner.temp }}/shadow-evidence" --bundle "${{ runner.temp }}/shadow-complete.tar"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete comparison and native execution receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shadow-complete-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shadow-complete.tar
            ${{ runner.temp }}/shadow-evidence/native
          if-no-files-found: error
          include-hidden-files: true
