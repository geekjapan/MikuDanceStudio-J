name: Renderer exact frame skin CPU diagnostic

on:
  workflow_dispatch:
  push:
    branches: [w4-renderer-exact-frame-skin-cpu-probe]

permissions:
  contents: read

concurrency:
  group: renderer-skin-frame-inputs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-frame-cpu:
    name: Exact frame skin CPU (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.95.0
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install compiler
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y --no-install-recommends clang pkg-config
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check diagnostic parsers
        run: python3 -I ../tools/renderer-skin-frame-inputs/test_check.py
      - name: Compare exact frame buffers with unchanged C++ harness
        run: python3 -I ../tools/renderer-skin-frame-inputs/check.py --out "$RUNNER_TEMP/renderer-skin-frame-inputs"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-skin-frame-inputs-linux-x64
          path: |
            ${{ runner.temp }}/renderer-skin-frame-inputs
            !${{ runner.temp }}/renderer-skin-frame-inputs/target/**
            !${{ runner.temp }}/renderer-skin-frame-inputs/tmp/**
          include-hidden-files: true
          if-no-files-found: error
