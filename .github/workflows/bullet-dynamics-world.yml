name: Bullet private dynamics world

on:
  push:
    branches: [w6-world-dynamics-owner]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bullet-dynamics-world-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Actual dynamics world (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            policy: generic-reference
          - os: ubuntu-24.04-arm
            policy: generic-reference
          - os: macos-15
            policy: generic-reference
          - os: windows-2022
            policy: mmd-win64-sse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Compile and measure the unmodified native archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          CXX: clang++
          POLICY: ${{ matrix.policy }}
        run: |
          set -euo pipefail
          python3 -B tools/bullet-rust-dynamics-world-check/check.py --out-dir "$RUNNER_TEMP/dynamics-world" --policy "$POLICY"
      - name: Compile and measure the actual Windows SSE consumer
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          set CXX=cl
          python -B tools\bullet-rust-dynamics-world-check\check.py --out-dir "%RUNNER_TEMP%\dynamics-world" --policy mmd-win64-sse
          exit /b %ERRORLEVEL%
      - name: Save all actual commands, sources, archives and raw checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dynamics-world-${{ matrix.os }}
          path: ${{ runner.temp }}/dynamics-world
          if-no-files-found: error
          include-hidden-files: true

  windows_replay:
    name: Actual Windows source replay (${{ matrix.os }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dynamics-world-windows-2022
          path: ${{ runner.temp }}/windows-dynamics-world
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Replay every Windows checkpoint with explicit SSE policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/bullet-rust-dynamics-world-check/check.py --out-dir "$RUNNER_TEMP/dynamics-world-replay" --replay-dir "$RUNNER_TEMP/windows-dynamics-world" --policy mmd-win64-sse
      - name: Save strict replay and compiled semantic controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dynamics-world-windows-replay-${{ matrix.os }}
          path: ${{ runner.temp }}/dynamics-world-replay
          if-no-files-found: error
          include-hidden-files: true
