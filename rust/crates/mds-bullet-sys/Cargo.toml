[package]
name = "mds-bullet-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Vendored Bullet 2.75 behind a C shim, built with deterministic float math"
publish = false
links = "mds_bullet"
build = "build.rs"

[features]
# Also builds shim/bench_main.cpp into <target>/<profile>/chain8_bench.
bench = []

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
