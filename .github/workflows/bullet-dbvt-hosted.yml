name: Bullet DBVT hosted profiles

on:
  push:
    branches: [w3-bullet-dbvt-hosted, w3-dbvt-explicit-policy-pure-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bullet-dbvt-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: DBVT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            profile: generic
            policy: generic-reference
          - os: ubuntu-24.04-arm
            arch: arm64
            profile: generic
            policy: generic-reference
          - os: macos-15
            arch: arm64
            profile: generic
            policy: generic-reference
          - os: windows-2022
            arch: x64
            profile: sse
            policy: mmd-win64-sse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          DBVT_OUT="$RUNNER_TEMP/bullet-dbvt"
          echo "DBVT_OUT=$DBVT_OUT" >> "$GITHUB_ENV"
          mkdir -p "$DBVT_OUT"
          set -o pipefail
          rustup toolchain install 1.95.0 --profile minimal 2>&1 | tee "$DBVT_OUT/toolchain-install.log"
      - name: Validate helper commands and profiles
        shell: bash
        run: |
          set -o pipefail
          python3 -I tools/bullet-rust-dbvt-check/test_check.py -v 2>&1 | tee "$DBVT_OUT/helper-tests.log"
          python3 -I -O tools/bullet-rust-dbvt-check/test_check.py -v 2>&1 | tee "$DBVT_OUT/helper-tests-optimized.log"
      - name: Recapture native DBVT and compare Rust
        if: runner.os != 'Windows'
        shell: bash
        env:
          CXX: clang++
        run: |
          set -o pipefail
          python3 tools/bullet-rust-dbvt-check/check.py --out-dir "$DBVT_OUT" --expected-profile '${{ matrix.profile }}' --expected-arch '${{ matrix.arch }}' --rust-policy '${{ matrix.policy }}' 2>&1 | tee "$DBVT_OUT/check.log"
      - name: Activate MSVC and recapture both native profiles
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 > "%DBVT_OUT%\vsdevcmd.log" 2>&1
          if errorlevel 1 exit /b 1
          where cl > "%DBVT_OUT%\compiler-path.txt" 2>&1
          if errorlevel 1 exit /b 1
          set CXX=cl
          python tools\bullet-rust-dbvt-check\check.py --out-dir "%DBVT_OUT%" --expected-profile sse --expected-arch x64 --rust-policy mmd-win64-sse > "%DBVT_OUT%\check.log" 2>&1
          set CHECK_RESULT=%ERRORLEVEL%
          type "%DBVT_OUT%\check.log"
          exit /b %CHECK_RESULT%
      - name: Save logs, captures, profiles and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-dbvt-${{ matrix.os }}
          path: ${{ runner.temp }}/bullet-dbvt
          if-no-files-found: error

  windows_replay:
    name: Windows-sourced DBVT replay (${{ matrix.os }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bullet-dbvt-windows-2022
          path: ${{ runner.temp }}/windows-capture
      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Replay actual Windows captures with explicit production policy
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/windows-replay"
          python3 tools/bullet-rust-dbvt-check/check.py --out-dir "$RUNNER_TEMP/windows-replay" --replay-dir "$RUNNER_TEMP/windows-capture" --rust-policy mmd-win64-sse 2>&1 | tee "$RUNNER_TEMP/windows-replay/check.log"
      - name: Run registered pure Bullet tests including Windows numeric fixtures
        shell: bash
        run: |
          set -o pipefail
          python3 tools/bullet-rust-math-check/check.py --rust-only --out-dir "$RUNNER_TEMP/pure-bullet" 2>&1 | tee "$RUNNER_TEMP/windows-replay/pure.log"
      - name: Save Windows-sourced replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbvt-windows-sourced-replay-${{ matrix.os }}
          path: ${{ runner.temp }}/windows-replay
          if-no-files-found: error
