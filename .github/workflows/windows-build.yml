name: Windows build

on:
  workflow_call:
    inputs:
      d3d9-capture:
        description: Run isolated unchanged-app selfshadow capture and HAL capability diagnostic
        required: false
        default: false
        type: boolean
      release-tag:
        description: Existing tag to validate and package; empty for CI
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare D3D9 capture provenance
        if: inputs.d3d9-capture
        run: >-
          python -I tools/oracle/d3d9_capture.py --prepare --root .
          --build out/ci/build/Release --out out/d3d9-capture
      - name: Test D3D9 capture runner boundaries
        if: inputs.d3d9-capture
        run: |
          python -I tools/oracle/test_d3d9_capture.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -O tools/oracle/test_d3d9_capture.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test scheduled-task exit boundary (stand-in scheduler)
        run: python -I tools/windows/test_runtask.py
      - name: Validate tag and version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release.py --tag "$env:RELEASE_TAG"
      - name: Install Conan
        run: python -m pip install conan==2.27.1
      - name: Build vendored Bullet and configure dependencies
        run: |
          conan profile detect --force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan create recipes/bullet275 --profile:all profiles/${{ matrix.arch }} -s compiler.cppstd=17 -s build_type=Release --build=missing --lockfile=""
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan install . --profile:all profiles/${{ matrix.arch }} -s compiler.cppstd=17 -s build_type=Release --build=missing --lockfile="" --output-folder=out/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure Release
        run: >-
          cmake -S . -B out/ci/build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/out/ci/build/generators/conan_toolchain.cmake"
          -DBUILD_TESTING=ON -DMIKUDANCESTUDIO_DIAG=OFF
          -DMIKUDANCESTUDIO_D3D9_CAPABILITY=${{ inputs.d3d9-capture && 'ON' || 'OFF' }}
      - name: Build Release
        run: cmake --build out/ci/build --config Release --parallel 4
      - name: Install legacy DirectX test runtime
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'directx_Jun2010_redist.exe'
          $unpack = Join-Path $env:RUNNER_TEMP 'directx-june2010'
          New-Item -ItemType Directory -Force $unpack | Out-Null
          # Microsoft Download Center, id=8109. Keep the exact tested payload.
          Invoke-WebRequest 'https://download.microsoft.com/download/8/4/a/84a35bf1-dafe-4ae8-82af-ad2ae20b6b14/directx_Jun2010_redist.exe' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '053F76DCBB28802E23341B6A787E3B0791C0FA5C8D4D011B1044172DBF89C73B') {
            throw 'Unexpected DirectX redistributable payload'
          }
          $extract = Start-Process -FilePath $archive -ArgumentList '/Q', ('/T:"{0}"' -f $unpack) -Wait -PassThru -WindowStyle Hidden
          if ($extract.ExitCode -ne 0) { throw "DirectX extraction failed: $($extract.ExitCode)" }
          $install = Start-Process -FilePath (Join-Path $unpack 'DXSETUP.exe') -ArgumentList '/silent' -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "DirectX installation failed: $($install.ExitCode)" }
      - name: Test capture VC90 provisioning boundaries (stand-in installer)
        if: inputs.d3d9-capture && matrix.arch == 'x64'
        run: |
          python -I tools/windows/test_provision_capture_vc90.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -O tools/windows/test_provision_capture_vc90.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Provision VC90 for unchanged-app capture only
        if: inputs.d3d9-capture && matrix.arch == 'x64'
        env:
          MDS_D3D9_CAPTURE: '1'
        run: >-
          ./tools/windows/provision_capture_vc90.ps1
          -Receipts "$env:GITHUB_WORKSPACE/out/d3d9-capture/vc90-provisioning"
      - name: Test capture audio boundaries (stand-in services and DirectSound)
        id: capture_audio_selftests
        if: always() && !cancelled() && inputs.d3d9-capture && matrix.arch == 'x64'
        run: |
          python -I tools/windows/test_provision_capture_audio.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -I -O tools/windows/test_provision_capture_audio.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Measure and prepare existing audio services for capture only
        if: always() && !cancelled() && inputs.d3d9-capture && matrix.arch == 'x64' && steps.capture_audio_selftests.outcome == 'success'
        timeout-minutes: 8
        env:
          MDS_D3D9_CAPTURE: '1'
        run: >-
          ./tools/windows/provision_capture_audio.ps1
          -Receipts "$env:GITHUB_WORKSPACE/out/d3d9-capture/audio-provisioning"
      - name: Capture unchanged selfshadow frames and D3D9 capabilities
        if: always() && inputs.d3d9-capture
        run: >-
          python -I tools/oracle/d3d9_capture.py --root .
          --build out/ci/build/Release --out out/d3d9-capture
      - name: Preserve D3D9 capture including partial failures
        if: always() && inputs.d3d9-capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-d3d9-capture-${{ matrix.arch }}
          path: out/d3d9-capture/
          if-no-files-found: error
      - name: Compare Rust camera refresh with the production C++ body
        working-directory: rust
        env:
          MDS_CAMERA_RELOAD_ORACLE: ${{ github.workspace }}/out/ci/build/Release/camera_reload_oracle.exe
          MDS_CAMERA_RELOAD_LOG_DIR: ${{ github.workspace }}/out/ci/build/camera-reload-comparisons
        run: |
          rustup show active-toolchain
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.95.0 test --locked -p mds-doc --test camera_reload 2>&1 |
            Tee-Object -FilePath ../out/ci/build/camera-reload-comparison.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Release regressions
        run: >-
          ctest --test-dir out/ci/build -C Release --output-on-failure
          --timeout 90 --no-tests=error
          --output-junit "$env:GITHUB_WORKSPACE/out/ci/build/test-results.xml"
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.arch }}
          path: |
            out/ci/build/test-results.xml
            out/ci/build/Testing/Temporary/*.log
          if-no-files-found: warn
      - name: Verify native camera evidence
        if: always()
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE 'out/ci/build'
          $manifest = Get-Content (Join-Path $build 'camera_reload_manifest.json') -Raw -ErrorAction Stop | ConvertFrom-Json
          foreach ($entry in $manifest.PSObject.Properties) {
            $hash = (Get-FileHash (Join-Path $build $entry.Name) -Algorithm SHA256 -ErrorAction Stop).Hash
            if ($hash -ne $entry.Value) { throw "Camera evidence hash mismatch: $($entry.Name)" }
          }
          Get-Item (Join-Path $build 'camera-reload-comparison.log') -ErrorAction Stop | Out-Null
          $cases = @(Get-ChildItem (Join-Path $build 'camera-reload-comparisons') -Filter '*.output.txt' -ErrorAction Stop)
          if ($cases.Count -eq 0) { throw 'No native camera comparisons retained' }
      - name: Preserve native camera provenance and comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-reload-${{ matrix.arch }}
          path: |
            out/ci/build/camera_reload_source.cpp
            out/ci/build/camera_reload_body.inc
            out/ci/build/camera_reload_manifest.json
            out/ci/build/camera-reload-comparison.log
            out/ci/build/camera-reload-comparisons/
          if-no-files-found: error
      - name: Package
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/release.py --tag "$env:RELEASE_TAG" --build-dir out/ci/build --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-tag != ''
        with:
          name: release-${{ matrix.arch }}
          path: out/release/*
          if-no-files-found: error

