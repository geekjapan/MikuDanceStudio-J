[package]
name = "mds-kinect"
description = "Kinect / OpenNI capture of the C++ application: joint smoothing, standard pose, key list, DxOpenNI.dll binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Loads Data\DxOpenNI.dll at run time. Windows only; off by default.
dxopenni = ["dep:libloading"]

[dependencies]
mds-math = { path = "../mds-math" }
mds-crtmath = { path = "../mds-crtmath" }
libm = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = { version = "0.9", optional = true }

[dev-dependencies]
encoding_rs = "0.8"
