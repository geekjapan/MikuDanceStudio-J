name: Shader compiler format facts

on:
  push:
    branches: [w4-shader-format-report-graph, w4-shader-common-plan, w4-shader-prepared-location-omission, w4-shader-common-symbol-schema-fix, w4-shader-unknown-wrapper-fix, w4-shader-retention-diagnostic, w4-shader-paged-plan-report]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shader-format-facts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  C2RUST_REV: ac687698b6c13491dfec45c6a9ad9e8b4da35227
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

defaults:
  run:
    shell: bash

jobs:
  arm64-ordinary-types:
    if: github.ref != 'refs/heads/w4-shader-retention-diagnostic' && github.ref != 'refs/heads/w4-shader-paged-plan-report'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-18
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      DOCS_RS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install ARM64 type-check dependencies
        timeout-minutes: 8
        run: |
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 install -y --no-install-recommends clang-18 llvm-18-dev libclang-18-dev libssl-dev pkg-config
          rustup toolchain install 1.95.0 --profile minimal
      - name: Type-check actual ordinary tool source on Linux ARM64
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/arm64-types"
          exec > >(tee "$RUNNER_TEMP/arm64-types/check.log") 2>&1
          test "$(uname -m)" = aarch64
          git init "$RUNNER_TEMP/c2rust-arm64"
          git -C "$RUNNER_TEMP/c2rust-arm64" remote add origin https://github.com/immunant/c2rust.git
          git -C "$RUNNER_TEMP/c2rust-arm64" fetch --depth 1 origin "$C2RUST_REV"
          git -C "$RUNNER_TEMP/c2rust-arm64" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/c2rust-arm64" rev-parse HEAD)" = "$C2RUST_REV"
          python3 -B tools/vkd3d-rust-probe/apply_c2rust_patch.py --source "$RUNNER_TEMP/c2rust-arm64" --artifacts "$RUNNER_TEMP/arm64-types"
          cargo +1.95.0 check --locked --manifest-path "$RUNNER_TEMP/c2rust-arm64/Cargo.toml" -p c2rust --bin c2rust-transpile
      - name: Retain ARM64 typing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-common-plan-arm64-types
          path: ${{ runner.temp }}/arm64-types/
          retention-days: 7
          if-no-files-found: error

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLVM_CONFIG_PATH: /usr/bin/llvm-config-18
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned translator dependencies
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/logs"
          exec > >(tee "$RUNNER_TEMP/format-facts/logs/packages.log") 2>&1
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends build-essential clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev cmake libssl-dev pkg-config bison flex libjson-perl xz-utils
          dpkg-query -W clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev
          echo "MDS_VKD3D_OUT=$RUNNER_TEMP/format-facts/prepared" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/c2rust-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.95.0 --profile minimal
      - name: Test compiler-free transport normally and optimized
        timeout-minutes: 15
        run: |
          python3 -B -m unittest discover -s tools/vkd3d-rust-probe -p test_closed_format_facts.py
          python3 -B -O -m unittest discover -s tools/vkd3d-rust-probe -p test_closed_format_facts.py
          python3 -B -m unittest discover -s tools/vkd3d-rust-probe -p test_common_plan.py
          python3 -B -O -m unittest discover -s tools/vkd3d-rust-probe -p test_common_plan.py
          python3 -B -m unittest discover -s tools/vkd3d-rust-probe -p test_common_plan_report.py
          python3 -B -O -m unittest discover -s tools/vkd3d-rust-probe -p test_common_plan_report.py
          python3 -B -m unittest discover -s tools/vkd3d-rust-probe -p test_retention_diagnostics.py
          python3 -B -O -m unittest discover -s tools/vkd3d-rust-probe -p test_retention_diagnostics.py
          python3 -B -m unittest discover -s tools/vkd3d-rust-probe -p test_run_diagnostics.py
          python3 -B -O -m unittest discover -s tools/vkd3d-rust-probe -p test_run_diagnostics.py
          PYTHONPATH=tools/vkd3d-rust-probe python3 -B -m unittest \
            test_probe.ProbeTests.test_completed_process_records_resources_and_logs \
            test_probe.ProbeTests.test_timeout_is_not_success \
            test_probe.ProbeTests.test_timeout_stops_spawned_children \
            test_probe.ProbeTests.test_interruption_and_exception_kill_and_reap_owned_child
      - name: Prepare pinned native source and headers
        timeout-minutes: 8
        run: |
          bash tools/vkd3d/build.sh linux-native > "$RUNNER_TEMP/format-facts/logs/source.log" 2>&1
          test -f "$MDS_VKD3D_OUT/work-linux-native/vkd3d-2.1/include/config.h"
          sha256sum tools/vkd3d/build.sh tools/vkd3d/patches/*.patch > "$RUNNER_TEMP/format-facts/logs/source-tools.sha256"
      - name: Build and test the actual patched compiler
        timeout-minutes: 18
        run: |
          exec > >(tee "$RUNNER_TEMP/format-facts/logs/compiler.log") 2>&1
          git init "$RUNNER_TEMP/c2rust-src"
          git -C "$RUNNER_TEMP/c2rust-src" remote add origin https://github.com/immunant/c2rust.git
          git -C "$RUNNER_TEMP/c2rust-src" fetch --depth 1 origin "$C2RUST_REV"
          git -C "$RUNNER_TEMP/c2rust-src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/c2rust-src" rev-parse HEAD)" = "$C2RUST_REV"
          python3 -B tools/vkd3d-rust-probe/apply_c2rust_patch.py --source "$RUNNER_TEMP/c2rust-src" --artifacts "$RUNNER_TEMP/format-facts/logs"
          cargo +1.95.0 install --locked --path "$RUNNER_TEMP/c2rust-src/c2rust" --root "$RUNNER_TEMP/format-facts/tool"
          python3 -B tools/vkd3d-rust-probe/apply_c2rust_patch.py --source "$RUNNER_TEMP/c2rust-src" --artifacts "$RUNNER_TEMP/format-facts/logs" --tool "$RUNNER_TEMP/format-facts/tool"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_format_ -- --list | tee "$RUNNER_TEMP/format-facts/logs/closed-format-tests-list.log"
          grep -F 'closed_format_native_record_identity_is_compiler_owned: test' "$RUNNER_TEMP/format-facts/logs/closed-format-tests-list.log"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_format_ -- --nocapture | tee "$RUNNER_TEMP/format-facts/logs/closed-format-tests-execution.log"
          grep -E 'test .*closed_format_native_record_identity_is_compiler_owned \.\.\. ok' "$RUNNER_TEMP/format-facts/logs/closed-format-tests-execution.log"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_variadic_inventory_uses_promoted_ast_types_and_linker_identity
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib c_ast::closed_plan::tests::closed_variadic_plan_fresh_threads_own_span_reservations -- --exact --list | tee "$RUNNER_TEMP/format-facts/logs/span-thread-test-list.log"
          grep -Fx 'c_ast::closed_plan::tests::closed_variadic_plan_fresh_threads_own_span_reservations: test' "$RUNNER_TEMP/format-facts/logs/span-thread-test-list.log"
          /usr/bin/time -v -o "$RUNNER_TEMP/format-facts/logs/span-thread-test-resources.log" cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib c_ast::closed_plan::tests::closed_variadic_plan_fresh_threads_own_span_reservations -- --exact --nocapture | tee "$RUNNER_TEMP/format-facts/logs/span-thread-test-execution.log"
          grep -Fx 'COMMON_PLAN_THREAD_EMIT first' "$RUNNER_TEMP/format-facts/logs/span-thread-test-execution.log"
          grep -Fx 'COMMON_PLAN_THREAD_EMIT second' "$RUNNER_TEMP/format-facts/logs/span-thread-test-execution.log"
          grep -Fx 'test c_ast::closed_plan::tests::closed_variadic_plan_fresh_threads_own_span_reservations ... ok' "$RUNNER_TEMP/format-facts/logs/span-thread-test-execution.log"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_variadic_plan_ -- --list | tee "$RUNNER_TEMP/format-facts/logs/common-plan-tests-list.log"
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/c2rust-src/Cargo.toml" -p c2rust-transpile --lib closed_variadic_plan_ -- --nocapture | tee "$RUNNER_TEMP/format-facts/logs/common-plan-tests-execution.log"
          python3 -B tools/vkd3d-rust-probe/check_common_plan.py --compiler-source "$RUNNER_TEMP/c2rust-src" --test-list "$RUNNER_TEMP/format-facts/logs/common-plan-tests-list.log" --test-log "$RUNNER_TEMP/format-facts/logs/common-plan-tests-execution.log" > "$RUNNER_TEMP/format-facts/logs/common-plan-tests.json"
          python3 -B tools/vkd3d-rust-probe/check_runtime.py --tool "$RUNNER_TEMP/format-facts/tool" --record
          cp "$RUNNER_TEMP/c2rust-src/Cargo.lock" "$RUNNER_TEMP/format-facts/logs/Cargo.lock"
          rustc +1.95.0 --version
          clang-18 --version
      - name: Bundle source and compiler for extraction
        run: |
          tar --exclude='*.o' --exclude='*.lo' --exclude='.libs' --exclude='.deps' -czf "$RUNNER_TEMP/format-facts/input.tar.gz" -C "$RUNNER_TEMP/format-facts" prepared/work-linux-native tool
          sha256sum "$RUNNER_TEMP/format-facts/input.tar.gz" > "$RUNNER_TEMP/format-facts/logs/input.sha256"
      - name: Retain setup and partial failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-format-facts-setup
          path: ${{ runner.temp }}/format-facts/logs/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-format-facts-input
          path: ${{ runner.temp }}/format-facts/input.tar.gz
          retention-days: 1
          if-no-files-found: error

  extract:
    if: github.ref != 'refs/heads/w4-shader-retention-diagnostic' && github.ref != 'refs/heads/w4-shader-paged-plan-report'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shader-format-facts-input
          path: ${{ runner.temp }}/format-facts
      - name: Install the matching translator runtime
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/evidence"
          exec > >(tee "$RUNNER_TEMP/format-facts/evidence/runtime-setup.log") 2>&1
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang-18 llvm-18-dev libclang-cpp18 libllvm18
          rustup toolchain install 1.95.0 --profile minimal
      - name: Extract prepared source and actual compiler
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/evidence"
          tar -xzf "$RUNNER_TEMP/format-facts/input.tar.gz" -C "$RUNNER_TEMP/format-facts"
          python3 -B tools/vkd3d-rust-probe/check_runtime.py --tool "$RUNNER_TEMP/format-facts/tool"
      - name: Exercise compiler extraction fixtures
        timeout-minutes: 6
        run: |
          python3 -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/vkd3d-rust-probe')
          from full_compiler import collect_closed_format_fixture
          from probe import run
          root = Path(os.environ['RUNNER_TEMP']) / 'format-facts'
          collect_closed_format_fixture(root / 'tool/bin/c2rust-transpile', Path('/usr/bin/clang-18'), root / 'evidence/compiler-fixture', run)
          PY
      - name: Check all24 native units and collect exact paired report-only outputs
        timeout-minutes: 65
        run: |
          python3 -B tools/vkd3d-rust-probe/probe.py --closed-format-facts \
            --source "$RUNNER_TEMP/format-facts/prepared/work-linux-native/vkd3d-2.1" \
            --artifacts "$RUNNER_TEMP/format-facts/evidence/result" \
            --c2rust "$RUNNER_TEMP/format-facts/tool/bin/c2rust" --clang /usr/bin/clang-18 --timeout 1800
          python3 -B tools/vkd3d-rust-probe/closed_format_facts.py --replay "$RUNNER_TEMP/format-facts/evidence/result/closed-format-facts"
          python3 -B -O tools/vkd3d-rust-probe/closed_format_facts.py --replay "$RUNNER_TEMP/format-facts/evidence/result/closed-format-facts"
      - name: Retain partial diagnostic report-only checkpoint before common plan
        id: report-only-checkpoint
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-format-facts-report-only-checkpoint
          path: ${{ runner.temp }}/format-facts/evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Exercise complete compiler-owned common plan and atomic output controls
        timeout-minutes: 38
        run: |
          printf 'Partial diagnostic report-only checkpoint outcome=%s\n' '${{ steps.report-only-checkpoint.outcome }}'
          python3 -B tools/vkd3d-rust-probe/check_common_plan.py \
            --tool "$RUNNER_TEMP/format-facts/tool/bin/c2rust-transpile" \
            --database "$RUNNER_TEMP/format-facts/evidence/result/compile_commands.json" \
            --output "$RUNNER_TEMP/format-facts/evidence/common-plan" --timeout 1800
      - name: Retain complete packet or raw partial extraction failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-format-facts-all24
          path: ${{ runner.temp }}/format-facts/evidence/
          retention-days: 7
          if-no-files-found: error

  retention-diagnostic:
    if: github.ref == 'refs/heads/w4-shader-retention-diagnostic' || github.ref == 'refs/heads/w4-shader-paged-plan-report'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: shader-format-facts-input
          path: ${{ runner.temp }}/format-facts
      - name: Install the matching translator runtime
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/evidence"
          exec > >(tee "$RUNNER_TEMP/format-facts/evidence/runtime-setup.log") 2>&1
          printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo timeout --kill-after=10s 120s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=10s 300s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang-18 llvm-18-dev libclang-cpp18 libllvm18
          rustup toolchain install 1.95.0 --profile minimal
      - name: Extract prepared source and actual compiler
        run: |
          mkdir -p "$RUNNER_TEMP/format-facts/evidence"
          tar -xzf "$RUNNER_TEMP/format-facts/input.tar.gz" -C "$RUNNER_TEMP/format-facts"
          python3 -B tools/vkd3d-rust-probe/check_runtime.py --tool "$RUNNER_TEMP/format-facts/tool"
      - name: Observe all24 common-plan ON exactly once
        timeout-minutes: 38
        run: |
          python3 -B tools/vkd3d-rust-probe/diagnose_common_plan_retention.py \
            --tool "$RUNNER_TEMP/format-facts/tool/bin/c2rust-transpile" \
            --source "$RUNNER_TEMP/format-facts/prepared/work-linux-native/vkd3d-2.1" \
            --clang /usr/bin/clang-18 \
            --output "$RUNNER_TEMP/format-facts/evidence/retention" --timeout 1800
      - name: Retain ON-only partial diagnostic observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: shader-retention-diagnostic
          path: ${{ runner.temp }}/format-facts/evidence/
          retention-days: 7
          if-no-files-found: error
