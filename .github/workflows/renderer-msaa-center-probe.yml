name: Renderer center reconstruction experiment

on:
  push:
    branches: [w4-renderer-msaa-center-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-msaa-center-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-llvmpipe:
    name: Paired A/B calibration and golden2 (Linux x64 llvmpipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Vulkan and build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends clang pkg-config libvulkan1 mesa-vulkan-drivers vulkan-tools
          rustup toolchain install 1.95.0 --profile minimal
      - name: Check evidence validation in normal and optimized Python
        run: |
          python3 tools/renderer-msaa-center-probe/test_check.py
          python3 -O tools/renderer-msaa-center-probe/test_check.py
      - name: Run same-job A/B experiment
        run: >-
          python3 tools/renderer-msaa-center-probe/check.py --run
          --out "${{ runner.temp }}/.renderer-center-evidence"
          --build-root "${{ runner.temp }}/renderer-center-build"
      - name: Preserve all experiment evidence including expected gate failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-center-paired-llvmpipe-${{ github.sha }}
          path: ${{ runner.temp }}/.renderer-center-evidence
          include-hidden-files: true
          if-no-files-found: error
