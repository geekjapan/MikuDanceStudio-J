name: Renderer required closure census
on:
  push:
    branches: [w4-renderer-c4200-progress-fix]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renderer-closure-census-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    name: Independent four-variant closure census (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize acquisition startup classification
        run: |
          Set-Content -LiteralPath "${{ runner.temp }}/closure-census-startup.txt" -Value 'no_acquisition_started'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compiler-free controls in both Python modes
        run: |
          python -B tools/renderer-floor-profile/test_run.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B -O tools/renderer-floor-profile/test_run.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install pinned existing Conan dependencies
        run: |
          python -m pip install conan==2.27.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan profile detect --force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan create recipes/bullet275 --profile:all profiles/x64 -s compiler.cppstd=17 -s build_type=Release --build=missing --lockfile=""
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan install . --profile:all profiles/x64 -s compiler.cppstd=17 -s build_type=Release --build=missing --lockfile="" --output-folder="${{ runner.temp }}/floor-profile-deps"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install hash-verified existing DirectX runtime
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'floor-profile-directx_Jun2010_redist.exe'
          $unpack = Join-Path $env:RUNNER_TEMP 'floor-profile-directx-june2010'
          New-Item -ItemType Directory $unpack | Out-Null
          Invoke-WebRequest 'https://download.microsoft.com/download/8/4/a/84a35bf1-dafe-4ae8-82af-ad2ae20b6b14/directx_Jun2010_redist.exe' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '053F76DCBB28802E23341B6A787E3B0791C0FA5C8D4D011B1044172DBF89C73B') { throw 'Unexpected DirectX payload' }
          $extract = Start-Process -FilePath $archive -ArgumentList '/Q', ('/T:"{0}"' -f $unpack) -Wait -PassThru -WindowStyle Hidden
          if ($extract.ExitCode -ne 0) { throw 'DirectX extraction failed' }
          $install = Start-Process -FilePath (Join-Path $unpack 'DXSETUP.exe') -ArgumentList '/silent' -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'DirectX installation failed' }
      - name: Acquire all four independent diagnostic variants
        run: |
          Set-Content -LiteralPath "${{ runner.temp }}/closure-census-startup.txt" -Value 'acquisition_invoked'
          python -B tools/renderer-floor-profile/run.py --run --closure-census --out "${{ runner.temp }}/closure-census-evidence" --build-root "${{ runner.temp }}/closure-census-build" --toolchain "${{ runner.temp }}/floor-profile-deps/build/generators/conan_toolchain.cmake"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Derive diagnostic writer custody
        id: custody
        if: always()
        run: |
          "upload=false" >> $env:GITHUB_OUTPUT
          $evidence = "${{ runner.temp }}/closure-census-evidence"
          if (-not (Test-Path -LiteralPath $evidence)) {
            $startup = "${{ runner.temp }}/closure-census-startup.txt"
            if ((Test-Path -LiteralPath $startup) -and (Get-Content -Raw -LiteralPath $startup).Trim() -eq 'no_acquisition_started') {
              Write-Output 'Startup failed before acquisition. No diagnostic writer was requested and there are no originals to upload.'
              exit 0
            }
            throw 'Acquisition custody is unknown. Upload prohibited.'
          }
          python -B tools/renderer-floor-profile/run.py --custody-check --out $evidence
          if ($LASTEXITCODE) { throw 'Diagnostic writer custody is unknown. Upload prohibited.' }
          "upload=true" >> $env:GITHUB_OUTPUT
      - name: Retain closed complete or partial diagnostic originals
        if: always() && steps.custody.outputs.upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: renderer-closure-census-${{ github.sha }}
          path: ${{ runner.temp }}/closure-census-evidence
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
